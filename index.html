<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RV Anime Explorer</title>
    
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="manifest" href="manifest.json">

    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: #eee; margin: 0; padding: 20px; }
        
        .header { text-align: center; margin-bottom: 30px; }
        
        /* Logo Styling */
        .header-logo { width: 100px; height: 100px; border-radius: 50%; border: 2px solid #ff4757; margin-bottom: 10px; transition: transform 0.3s; }
        .header-logo:hover { transform: rotate(10deg) scale(1.1); }
        
        h1 { color: #ff4757; margin: 10px 0; }

        /* Search Bar */
        .search-container { text-align: center; margin-bottom: 30px; }
        #search-input { 
            padding: 12px 20px; width: 60%; border-radius: 25px; border: 2px solid #333; 
            outline: none; font-size: 1rem; background: #222; color: white;
            transition: border-color 0.3s;
        }
        #search-input:focus { border-color: #ff4757; }

        /* Loading Spinner */
        .loader {
            border: 5px solid #333;
            border-top: 5px solid #ff4757;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 50px auto;
            display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Anime Grid */
        #anime-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .anime-card { background: #1e1e1e; border-radius: 10px; overflow: hidden; border: 1px solid #333; cursor: pointer; transition: 0.3s; }
        .anime-card:hover { transform: translateY(-5px); border-color: #ff4757; box-shadow: 0 5px 15px rgba(255, 71, 87, 0.3); }
        .anime-card img { width: 100%; height: 300px; object-fit: cover; }
        .anime-info { padding: 15px; text-align: center; }
        .anime-title { font-size: 0.9rem; font-weight: bold; height: 40px; overflow: hidden; }

        /* Video & Episode Modal */
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); overflow-y: auto; }
        .modal-content { position: relative; margin: 5% auto; width: 90%; max-width: 800px; background: #1a1a1a; padding: 20px; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
        .close-btn { position: absolute; top: 10px; right: 20px; color: white; font-size: 35px; cursor: pointer; z-index: 101; }
        .close-btn:hover { color: #ff4757; }
        iframe { width: 100%; height: 400px; border-radius: 10px; border: 2px solid #ff4757; background: #000; }

        /* Episode List Styles */
        #episode-container { margin-top: 20px; border-top: 1px solid #444; padding-top: 15px; color: white; }
        #modal-episode-list { max-height: 200px; overflow-y: auto; list-style: none; padding: 0; scrollbar-width: thin; scrollbar-color: #ff4757 #111; }
        #modal-episode-list li { padding: 8px; border-bottom: 1px solid #222; font-size: 0.9rem; }
        #modal-episode-list li:hover { background-color: #222; }
        #modal-episode-list::-webkit-scrollbar { width: 6px; }
        #modal-episode-list::-webkit-scrollbar-thumb { background: #ff4757; border-radius: 10px; }
        
        .hidden { display: none !important; }

        /* Footer */
        footer { text-align: center; padding: 40px; color: #666; border-top: 1px solid #333; margin-top: 50px; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="header">
        <img src="logo.png" alt="RV Anime Logo" class="header-logo" onerror="this.src='https://via.placeholder.com/100?text=RV'">
        <h1>RV Anime Explorer</h1>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search for an anime and hit Enter...">
        </div>
    </div>
    
    <div id="loader" class="loader"></div>
    <div id="anime-container"></div>

    <!-- Unified Modal for Trailer & Episodes -->
    <div id="anime-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="close-modal">&times;</span>
            
            <div class="video-wrapper">
                <iframe id="trailer-video" src="" frameborder="0" allowfullscreen></iframe>
            </div>

            <div id="episode-container">
                <h4>Episode Guide</h4>
                <div id="episode-loader" class="hidden">Loading episodes...</div>
                <ul id="modal-episode-list"></ul>
            </div>
        </div>
    </div>

    <footer>
        <p>Developed with ❤️ for the Anime Community</p>
        <p>Data provided by Jikan API (MyAnimeList)</p>
    </footer>

    <script>
        const container = document.getElementById('anime-container');
        const searchInput = document.getElementById('search-input');
        const loader = document.getElementById('loader');
        
        const modal = document.getElementById('anime-modal');
        const iframe = document.getElementById('trailer-video');
        const epList = document.getElementById('modal-episode-list');
        const epLoader = document.getElementById('episode-loader');
        const closeBtn = document.getElementById('close-modal');

        // Fetch Data from Jikan API
        async function getAnime(query = '') {
            loader.style.display = 'block';
            container.innerHTML = ''; 

            const url = query 
                ? `https://api.jikan.moe/v4/anime?q=${encodeURIComponent(query)}&limit=20` 
                : 'https://api.jikan.moe/v4/top/anime?limit=20';

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Network error');
                const result = await response.json();
                loader.style.display = 'none';
                displayResults(result.data);
            } catch (error) {
                loader.style.display = 'none';
                container.innerHTML = '<p style="text-align:center;">Failed to load data. Please check your connection.</p>';
            }
        }

        // Display Data
        function displayResults(animeList) {
            container.innerHTML = '';
            if (!animeList || animeList.length === 0) {
                container.innerHTML = '<p style="text-align:center;">No results found.</p>';
                return;
            }
            animeList.forEach(anime => {
                const card = document.createElement('div');
                card.className = 'anime-card';
                card.innerHTML = `
                    <img src="${anime.images?.jpg?.large_image_url || 'https://via.placeholder.com/300x450?text=No+Image'}" alt="${anime.title}">
                    <div class="anime-info">
                        <div class="anime-title">${anime.title}</div>
                    </div>
                `;
                
                // Safely get trailer URL or fallback
                const trailerUrl = anime.trailer?.embed_url || '';
                card.onclick = () => openAnimeModal(anime.mal_id, trailerUrl);
                
                container.appendChild(card);
            });
        }

        // Combined Modal Logic: Video Trailer + Episode Fetching
        async function openAnimeModal(animeId, trailerUrl) {
            // Set Trailer
            if (trailerUrl) {
                iframe.src = trailerUrl;
            } else {
                iframe.src = ''; 
            }

            modal.style.display = "block";

            // Reset & Fetch Episode List
            epList.innerHTML = ''; 
            epLoader.innerText = 'Loading episodes...';
            epLoader.classList.remove('hidden'); 

            try {
                const response = await fetch(`https://api.jikan.moe/v4/anime/${animeId}/episodes`);
                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                
                const result = await response.json();
                const episodes = result.data;

                epLoader.classList.add('hidden'); 

                if (episodes && episodes.length > 0) {
                    episodes.forEach(ep => {
                        const li = document.createElement('li');
                        li.innerHTML = `<strong>${ep.mal_id}.</strong> ${ep.title || 'Untitled'}`;
                        epList.appendChild(li);
                    });
                } else {
                    epList.innerHTML = '<li>No episode titles found for this anime.</li>';
                }
            } catch (error) {
                epLoader.classList.remove('hidden');
                epLoader.innerText = "Failed to load episodes (Rate limit or unavailable).";
                console.error("Jikan API Error:", error);
            }
        }

        // Close Modal & Clear Video Audio
        function closeModal() {
            modal.style.display = "none";
            iframe.src = ''; 
        }

        closeBtn.onclick = closeModal;
        window.onclick = (e) => { if (e.target === modal) closeModal(); };

        // Search listener
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') getAnime(searchInput.value);
        });

        // Initial Load
        getAnime();
    </script>
</body>
    </html>
